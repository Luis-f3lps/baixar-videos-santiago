<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeCut - Baixar e Cortar Vídeos do YouTube</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▶️</text></svg>">
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #16161c;
            --primary: #ff0033;
            --primary-hover: #d9002b;
            --accent: #3ea6ff;
            --text-main: #f1f1f1;
            --text-muted: #9aa0a6;
            --border-color: #2a2a35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 540px;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 26px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .yt-badge {
            background-color: var(--primary);
            color: white;
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 20px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 8px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .url-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: #0e0e12;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .btn-paste {
            background-color: #24242e;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-paste:hover {
            background-color: #30303d;
        }

        .video-preview {
            display: none;
            margin-bottom: 22px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background-color: #0e0e12;
        }

        .video-preview.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .video-preview img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .preview-info {
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-id {
            color: var(--accent);
            font-family: monospace;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quick-presets {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: #1e1e26;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .preset-btn:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
            background: #0e0e12;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .time-card {
            display: flex;
            flex-direction: column;
        }

        .time-card span {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .time-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        .btn-download {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.15s;
            box-shadow: 0 6px 20px rgba(255, 0, 51, 0.3);
        }

        .btn-download:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-box {
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            background-color: #0e0e12;
            border: 1px solid var(--border-color);
            font-size: 14px;
            display: none;
            text-align: center;
            line-height: 1.5;
        }

        .status-box.active {
            display: block;
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1><span class="yt-badge">▶</span> TubeCut</h1>
            <p>Baixe vídeos do YouTube cortando o início e o final exatos</p>
        </div>

        <div class="input-group">
            <label for="ytUrl">Link do Vídeo do YouTube</label>
            <div class="url-box">
                <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
                <button class="btn-paste" id="pasteBtn">Colar</button>
            </div>
        </div>

        <div class="video-preview" id="videoPreview">
            <img id="thumbImg" src="" alt="Capa do vídeo" crossorigin="anonymous">
            <div class="preview-info">
                <span>Vídeo identificado</span>
                <span class="preview-id" id="videoIdLabel"></span>
            </div>
        </div>

        <label>Atalhos de Corte</label>
        <div class="quick-presets">
            <button class="preset-btn" onclick="aplicarAtalho(2, 0, 0, 0)">Pular 2 min iniciais</button>
            <button class="preset-btn" onclick="aplicarAtalho(0, 0, 2, 0)">Cortar 2 min finais</button>
            <button class="preset-btn" onclick="aplicarAtalho(2, 0, 2, 0)">2 min início + 2 min fim</button>
            <button class="preset-btn" onclick="aplicarAtalho(0, 0, 0, 0)">Vídeo inteiro</button>
        </div>

        <div class="time-grid">
            <div class="time-card">
                <span>Começar em (Min : Seg)</span>
                <div class="time-inputs">
                    <input type="number" id="startMin" min="0" value="2" placeholder="Min">
                    <strong>:</strong>
                    <input type="number" id="startSec" min="0" max="59" value="0" placeholder="Seg">
                </div>
            </div>

            <div class="time-card">
                <span>Cortar antes do fim (Min : Seg)</span>
                <div class="time-inputs">
                    <input type="number" id="endCutMin" min="0" value="2" placeholder="Min">
                    <strong>:</strong>
                    <input type="number" id="endCutSec" min="0" max="59" value="0" placeholder="Seg">
                </div>
            </div>
        </div>

        <button class="btn-download" id="downloadBtn">Cortar e Baixar MP4</button>

        <div class="status-box" id="statusBox"></div>
    </div>

    <script>
        const urlInput = document.getElementById('ytUrl');
        const pasteBtn = document.getElementById('pasteBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusBox = document.getElementById('statusBox');
        const videoPreview = document.getElementById('videoPreview');
        const thumbImg = document.getElementById('thumbImg');
        const videoIdLabel = document.getElementById('videoIdLabel');

        function extrairIdYouTube(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        function atualizarPreview() {
            const videoId = extrairIdYouTube(urlInput.value.trim());
            if (videoId) {
                thumbImg.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                videoIdLabel.textContent = `ID: ${videoId}`;
                videoPreview.classList.add('visible');
            } else {
                videoPreview.classList.remove('visible');
            }
        }

        urlInput.addEventListener('input', atualizarPreview);

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                urlInput.value = text;
                atualizarPreview();
            } catch (err) {
                alert('Permita o acesso à área de transferência ou cole manualmente.');
            }
        });

        function aplicarAtalho(sMin, sSec, eMin, eSec) {
            document.getElementById('startMin').value = sMin;
            document.getElementById('startSec').value = sSec;
            document.getElementById('endCutMin').value = eMin;
            document.getElementById('endCutSec').value = eSec;
        }

        function mostrarStatus(mensagem, carregando = false) {
            statusBox.classList.add('active');
            statusBox.innerHTML = carregando
                ? `<span class="loader"></span> ${mensagem}`
                : mensagem;
        }

        downloadBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            const videoId = extrairIdYouTube(url);

            if (!videoId) {
                mostrarStatus('Insira um link válido do YouTube.');
                return;
            }

            const startTotalSeconds = (parseInt(document.getElementById('startMin').value) || 0) * 60
                + (parseInt(document.getElementById('startSec').value) || 0);

            const endTrimSeconds = (parseInt(document.getElementById('endCutMin').value) || 0) * 60
                + (parseInt(document.getElementById('endCutSec').value) || 0);

            downloadBtn.disabled = true;
            mostrarStatus('Buscando stream do vídeo...', true);

            try {
                const {FFmpeg} = FFmpegWASM;
                const {fetchFile} = FFmpegUtil;

                const apiRes = await fetch('/api/info', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: `https://www.youtube.com/watch?v=${videoId}`})
                });

                const apiData = await apiRes.json();
                if (!apiRes.ok) throw new Error(apiData.error || 'Erro ao buscar vídeo');

                const duracaoTotal = apiData.duration;
                const tempoFinal = duracaoTotal - endTrimSeconds;
                if (tempoFinal <= startTotalSeconds) {
                    throw new Error('O tempo de corte excede a duração total do vídeo.');
                }

                mostrarStatus('Carregando motor de corte...', true);
                const ffmpeg = new FFmpeg();
                await ffmpeg.load({
                    coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js'
                });

                mostrarStatus('Baixando vídeo para recorte...', true);
                await ffmpeg.writeFile('input.mp4', await fetchFile(apiData.downloadUrl));

                mostrarStatus(`Cortando de ${startTotalSeconds}s até ${tempoFinal}s...`, true);
                await ffmpeg.exec([
                    '-ss', String(startTotalSeconds),
                    '-to', String(tempoFinal),
                    '-i', 'input.mp4',
                    '-c', 'copy',
                    'output.mp4'
                ]);

                const data = await ffmpeg.readFile('output.mp4');
                const blob = new Blob([data.buffer], {type: 'video/mp4'});
                const downloadLink = document.createElement('a');
                downloadLink.href = URL.createObjectURL(blob);
                downloadLink.download = `youtube_${videoId}_cortado.mp4`;
                downloadLink.click();

                mostrarStatus('Download concluído!');
            } catch (error) {
                mostrarStatus(`Erro: ${error.message}`);
            } finally {
                downloadBtn.disabled = false;
            }
        });
    </script>

</body>

</html>
