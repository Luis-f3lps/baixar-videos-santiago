<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikCut - Baixar e Cortar Vídeos do TikTok</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a22;
            --primary: #fe2c55;
            --secondary: #25f4ee;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --border-color: #2e2e3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 520px;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--secondary), #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 6px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .url-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: #121217;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--secondary);
        }

        .btn-paste {
            background-color: #252530;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-paste:hover {
            background-color: #323240;
        }

        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
            background: #121217;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .time-card {
            display: flex;
            flex-direction: column;
        }

        .time-card span {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .time-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        .quick-presets {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .preset-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .btn-download {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--primary), #ff4d6d);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(254, 44, 85, 0.35);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(254, 44, 85, 0.5);
        }

        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-box {
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            background-color: #121217;
            border: 1px solid var(--border-color);
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .status-box.active {
            display: block;
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--secondary);
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>TikCut Downloader</h1>
        <p>Baixe trechos exatos de vídeos do TikTok sem marca d'água</p>
    </div>

    <!-- Link do Vídeo -->
    <div class="input-group">
        <label for="tiktokUrl">Link do Vídeo</label>
        <div class="url-box">
            <input type="text" id="tiktokUrl" placeholder="Cole o link do TikTok aqui...">
            <button class="btn-paste" id="pasteBtn" title="Colar da área de transferência">Colar</button>
        </div>
    </div>

    <!-- Atalhos rápidos de corte -->
    <label>Atalhos de Corte</label>
    <div class="quick-presets">
        <button class="preset-btn" onclick="aplicarAtalho(2, 0, 0, 0)">Cortar 2 min do início</button>
        <button class="preset-btn" onclick="aplicarAtalho(0, 0, 2, 0)">Cortar 2 min do final</button>
        <button class="preset-btn" onclick="aplicarAtalho(2, 0, 2, 0)">2 min início + 2 min fim</button>
        <button class="preset-btn" onclick="aplicarAtalho(0, 0, 0, 0)">Vídeo completo</button>
    </div>

    <!-- Seleção de Tempo -->
    <div class="time-grid">
        <div class="time-card">
            <span>Iniciar a partir de (Min : Seg)</span>
            <div class="time-inputs">
                <input type="number" id="startMin" min="0" value="0" placeholder="Min">
                <strong>:</strong>
                <input type="number" id="startSec" min="0" max="59" value="0" placeholder="Seg">
            </div>
        </div>

        <div class="time-card">
            <span>Remover do final (Min : Seg)</span>
            <div class="time-inputs">
                <input type="number" id="endCutMin" min="0" value="0" placeholder="Min">
                <strong>:</strong>
                <input type="number" id="endCutSec" min="0" max="59" value="0" placeholder="Seg">
            </div>
        </div>
    </div>

    <button class="btn-download" id="downloadBtn">Processar e Baixar Corte</button>

    <div class="status-box" id="statusBox"></div>
</div>

<script>
    const urlInput = document.getElementById('tiktokUrl');
    const pasteBtn = document.getElementById('pasteBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusBox = document.getElementById('statusBox');

    // Botão para colar link automaticamente
    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            urlInput.value = text;
        } catch (err) {
            alert('Permita o acesso à área de transferência ou cole manualmente (Ctrl+V).');
        }
    });

    // Função para preencher os atalhos rapidamente
    function aplicarAtalho(sMin, sSec, eMin, eSec) {
        document.getElementById('startMin').value = sMin;
        document.getElementById('startSec').value = sSec;
        document.getElementById('endCutMin').value = eMin;
        document.getElementById('endCutSec').value = eSec;
    }

    function mostrarStatus(mensagem, carregando = false) {
        statusBox.classList.add('active');
        statusBox.innerHTML = carregando 
            ? `<span class="loader"></span> ${mensagem}` 
            : mensagem;
    }

    downloadBtn.addEventListener('click', async () => {
        const url = urlInput.value.trim();
        
        if (!url || !url.includes('tiktok.com')) {
            mostrarStatus('❌ Por favor, insira um link válido do TikTok.');
            return;
        }

        // Converte minutos e segundos para segundos totais
        const startTotalSeconds = (parseInt(document.getElementById('startMin').value) || 0) * 60 
                                + (parseInt(document.getElementById('startSec').value) || 0);
        
        const endTrimSeconds = (parseInt(document.getElementById('endCutMin').value) || 0) * 60 
                             + (parseInt(document.getElementById('endCutSec').value) || 0);

        downloadBtn.disabled = true;
        mostrarStatus('Buscando vídeo no servidor...', true);

        try {
            /* ========================================================================
               COMO CONECTAR AO SEU BACK-END REAL:
               Para funcionar em produção, você deve enviar esses dados para uma API
               própria (ex: Node.js + yt-dlp + fluent-ffmpeg) que baixa e corta o vídeo.
               ======================================================================== */
            
            // Exemplo de chamada para sua futura API:
            /*
            const response = await fetch('http://localhost:3000/api/baixar-cortar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    url: url,
                    inicioSegundos: startTotalSeconds,
                    cortarFinalSegundos: endTrimSeconds
                })
            });

            if (!response.ok) throw new Error('Erro ao processar vídeo');
            
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = 'tiktok_cortado.mp4';
            a.click();
            */

            // Simulação visual do fluxo para demonstração da interface:
            await new Promise(r => setTimeout(r, 1500));
            mostrarStatus(`Cortando vídeo (Início: ${startTotalSeconds}s | Remover do fim: ${endTrimSeconds}s)...`, true);
            await new Promise(r => setTimeout(r, 1500));
            
            mostrarStatus(`✅ Interface pronta! Conecte o endpoint <code>/api/baixar-cortar</code> no JS para baixar o MP4 real.`);
        } catch (error) {
            mostrarStatus('❌ Erro ao processar o vídeo. Verifique o servidor.');
        } finally {
            downloadBtn.disabled = false;
        }
    });
</script>

</body>
</html>
